name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Serve the production build, wait for it, then walk the definition of done.
      # The readiness loop is plain curl rather than a helper package, so CI
      # depends only on what the repository actually declares.
      - run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/map; then
              echo "server ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "server did not become ready within 60s" >&2
              exit 1
            fi
            sleep 1
          done
          npm run test:browser
        env:
          BASE_URL: http://localhost:3000
